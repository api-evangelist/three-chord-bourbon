aid: three-chord-bourbon
name: Three Chord Bourbon
description: 'Three Chord Bourbon, Inc. is an American whiskey blending house founded
  in 2017 by Rock & Roll Hall of Fame guitarist, producer and songwriter Neil Giraldo,
  who serves as founder, creative director and chairman. The company blends straight
  bourbon whiskeys aged a minimum of four years using a proprietary process it calls
  "Perfectly Tuned Taste," and has extended the line into rye and cask-finished expressions
  including a pinot noir cask finish and the Amplify rye. Product is co-packed at Ugly
  Dog Distillery in Chelsea, Michigan, and the corporate office is in Clarence, New
  York. The brand sells through wholesale distribution and a direct-to-consumer online
  store at store.threechordbourbon.com. It is a consumer packaged goods company: it
  publishes no developer portal, no API documentation, no SDKs and no machine-readable
  API contract of any kind.'
